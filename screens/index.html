<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>弹珠超载 V2.1 · 实机截图</title>
<style>
:root{color-scheme:dark;background:#030c23;color:#f2faff;font:16px system-ui,sans-serif}
body{max-width:1000px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
h1{font-size:clamp(22px,5vw,36px);margin:0}
h2{font-size:18px;margin-top:28px}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:16px}
figure{margin:0 0 16px;min-width:0}
.desktop{grid-column:1/-1}
figcaption{color:#bddbec;font-size:14px;margin-bottom:6px}
figure img{display:block;width:100%;height:auto;border:1px solid #399cdb;border-radius:12px;box-sizing:border-box}
.play{display:inline-flex;align-items:center;min-height:44px;padding:0 15px;background:#6ee7ff;color:#062646;border-radius:12px;text-decoration:none;font-weight:750}
a:focus-visible{outline:2px solid #aaf3ff;outline-offset:3px}
@media(max-width:570px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}}
</style>
</head>
